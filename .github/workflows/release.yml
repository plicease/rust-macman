name: Release

on:
  push:
    branches: [main]


concurrency: release-${{ github.ref }}


permissions:
  contents: write


jobs:
  release:
    uses: uperl/action-rust-release-bin/.github/workflows/release.yml@v1
    with:
      publisher: "plicease"
      # Listed explicitly so that a change to the reusable workflow's default
      # can't add a target. Leave out targets where macman can't yet build and
      # run Mini vMac, which excludes aarch64-unknown-linux-gnu,
      # x86_64-apple-darwin, and i686-pc-windows-msvc. See docs/PLATFORMS.md
      # before adding one.
      targets: >-
        {"include":[
        {"target":"x86_64-unknown-linux-gnu","os":"ubuntu-latest"},
        {"target":"i686-unknown-linux-gnu","os":"ubuntu-latest"},
        {"target":"aarch64-apple-darwin","os":"macos-14"},
        {"target":"x86_64-pc-windows-msvc","os":"windows-latest"}
        ]}


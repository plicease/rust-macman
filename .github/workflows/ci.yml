
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: uperl/action-rust-ci/.github/workflows/ci.yml@v1

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked

  # du --physical on the file systems where it can tell which blocks files
  # share, with reflinks and deduplication; ext4 is the runner's own.
  filesystems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y btrfs-progs xfsprogs
      - name: Mount Btrfs, with a subvolume, and XFS
        run: |
          truncate -s 1G "$RUNNER_TEMP/btrfs.img" "$RUNNER_TEMP/xfs.img"
          mkfs.btrfs -q "$RUNNER_TEMP/btrfs.img"
          mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/xfs.img"
          for fs in btrfs xfs; do
            sudo mkdir -p "/mnt/$fs"
            sudo mount -o loop "$RUNNER_TEMP/$fs.img" "/mnt/$fs"
          done
          sudo btrfs subvolume create /mnt/btrfs/sub
          sudo chmod 1777 /mnt/btrfs /mnt/btrfs/sub /mnt/xfs
          df -T /tmp /mnt/btrfs /mnt/xfs
      - run: cargo test --locked --test physical -- --nocapture
        env:
          MACMAN_TEST_FS_DIRS: /mnt/btrfs:/mnt/xfs:/mnt/btrfs/sub
          MACMAN_TEST_MEASURABLE_DIRS: /tmp:/mnt/btrfs:/mnt/xfs:/mnt/btrfs/sub

  # The same on Windows: NTFS is the runner's own, ReFS has block cloning,
  # and exFAT can't be measured.
  windows-filesystems:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mount ReFS and exFAT
        shell: pwsh
        run: |
          $script = foreach ($fs in @{ name = 'refs'; letter = 'R' }, @{ name = 'exfat'; letter = 'X' }) {
            $vhd = Join-Path $env:RUNNER_TEMP "$($fs.name).vhdx"
            "create vdisk file=`"$vhd`" maximum=2048 type=expandable"
            "select vdisk file=`"$vhd`""
            'attach vdisk'
            'create partition primary'
            "format fs=$($fs.name) quick"
            "assign letter=$($fs.letter)"
          }
          $script | Set-Content -Encoding ascii "$env:RUNNER_TEMP\volumes.txt"
          diskpart /s "$env:RUNNER_TEMP\volumes.txt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Volume -DriveLetter R, X | Format-Table DriveLetter, FileSystemType, AllocationUnitSize
      - run: cargo test --locked --test physical -- --nocapture
        env:
          MACMAN_TEST_FS_DIRS: 'R:\;X:\'
          MACMAN_TEST_MEASURABLE_DIRS: '${{ runner.temp }};R:\'
